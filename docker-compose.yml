services:
  mongodb:
    image: mongo:7
    container_name: refp-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./src/docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: refp-backend
    ports:
      - "5000:5000"
    environment:
      - MongoDb__ConnectionString=mongodb://mongodb:27017
      - MongoDb__DatabaseName=real_estate_planner
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: refp-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mongo-data:
