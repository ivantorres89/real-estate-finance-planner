@if (loading) {
  <div class="spinner-wrapper">
    <mat-spinner diameter="48"></mat-spinner>
  </div>
} @else {
  <div class="detail-container">
    <div class="header-row">
      <button mat-icon-button (click)="goBack()">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <input class="scenario-name-input"
             [(ngModel)]="model.name"
             placeholder="Scenario name" />
      <span class="spacer"></span>
      <button mat-flat-button color="primary" (click)="save()" [disabled]="saving || !model.name">
        <mat-icon>save</mat-icon>
        {{ saving ? 'Saving...' : 'Save' }}
      </button>
      @if (!isNew) {
        <button mat-flat-button color="accent"
                (click)="runAnalysis()"
                [disabled]="analyzing"
                class="analyze-btn">
          <mat-icon>analytics</mat-icon>
          {{ analyzing ? 'Analyzing...' : 'Run Analysis' }}
        </button>
      }
    </div>

    <mat-tab-group animationDuration="200ms">
      <!-- Tab 1: Sale & Liquidity -->
      <mat-tab label="Sale & Liquidity">
        <div class="tab-content">
          <app-sale-data [sale]="model.sale"
                         [debtCapacity]="model.debtCapacity">
          </app-sale-data>
        </div>
      </mat-tab>

      <!-- Tab 2: Purchase -->
      <mat-tab label="Purchase">
        <div class="tab-content">
          <app-purchase-data [purchase]="model.purchase"></app-purchase-data>
        </div>
      </mat-tab>

      <!-- Tab 3+: Bank Offers -->
      @for (bank of model.banks; track trackByIndex($index)) {
        <mat-tab>
          <ng-template mat-tab-label>
            <span>{{ bank.bankName || 'Bank ' + ($index + 1) }}</span>
            <button mat-icon-button class="tab-close"
                    (click)="removeBank($index); $event.stopPropagation()">
              <mat-icon>close</mat-icon>
            </button>
          </ng-template>
          <div class="tab-content">
            <app-bank-offer [bank]="bank"></app-bank-offer>
          </div>
        </mat-tab>
      }

      <!-- Add Bank Tab -->
      <mat-tab disabled>
        <ng-template mat-tab-label>
          <button mat-icon-button (click)="addBank()">
            <mat-icon>add</mat-icon>
          </button>
        </ng-template>
      </mat-tab>

      <!-- Strategy Parameters -->
      <mat-tab label="Strategy">
        <div class="tab-content">
          <app-strategy-comparison [params]="model.strategyParameters">
          </app-strategy-comparison>
        </div>
      </mat-tab>

      <!-- Results -->
      @if (analysisResult) {
        <mat-tab label="Results">
          <div class="tab-content">
            <app-analysis-results [result]="analysisResult"></app-analysis-results>
          </div>
        </mat-tab>
      }
    </mat-tab-group>
  </div>
}
